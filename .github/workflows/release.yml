name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build all jars
        run: ./gradlew buildAllJars
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/dist/*.jar

  publish-modrinth:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: bedbugs-*+1.16.5-forge.jar
            game: '1.16.5'
            loaders: '["forge"]'
          - file: bedbugs-*+1.19.4-fabric.jar
            game: '1.19.4'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.20.1-fabric.jar
            game: '1.20.1'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.20.4-fabric.jar
            game: '1.20.4'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.20.4-neoforge.jar
            game: '1.20.4'
            loaders: '["neoforge"]'
          - file: bedbugs-*+1.20.6-fabric.jar
            game: '1.20.6'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.20.6-neoforge.jar
            game: '1.20.6'
            loaders: '["neoforge"]'
          - file: bedbugs-*+1.21.1-fabric.jar
            game: '1.21.1'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.21.1-neoforge.jar
            game: '1.21.1'
            loaders: '["neoforge"]'
          - file: bedbugs-*+1.21.4-fabric.jar
            game: '1.21.4'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.21.4-neoforge.jar
            game: '1.21.4'
            loaders: '["neoforge"]'
          - file: bedbugs-*+1.21.5-fabric.jar
            game: '1.21.5'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.21.5-neoforge.jar
            game: '1.21.5'
            loaders: '["neoforge"]'
          - file: bedbugs-*+1.21.8-fabric.jar
            game: '1.21.8'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.21.8-neoforge.jar
            game: '1.21.8'
            loaders: '["neoforge"]'
          - file: bedbugs-*+1.21.11-fabric.jar
            game: '1.21.11'
            loaders: '["fabric"]'
          - file: bedbugs-*+1.21.11-neoforge.jar
            game: '1.21.11'
            loaders: '["neoforge"]'
          - file: bedbugs-*+26.2-fabric.jar
            game: '26.2'
            loaders: '["fabric"]'
          - file: bedbugs-*+26.2-neoforge.jar
            game: '26.2'
            loaders: '["neoforge"]'
          - file: bedbugs-*+26.3-fabric.jar
            game: '26.3'
            loaders: '["fabric"]'
          - file: bedbugs-*+26.3-neoforge.jar
            game: '26.3'
            loaders: '["neoforge"]'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: dist
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/${{ matrix.file }}
          game-versions: ${{ matrix.game }}
          loaders: ${{ matrix.loaders }}
          version-type: release
