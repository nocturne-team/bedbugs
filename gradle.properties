# This file is used for Gradle options, for the rest use stonecutter.properties.toml
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Legacy Forge's Unimined pipeline prepares mapped Minecraft artifacts during
# configuration and retains its mapping provider in remap tasks. It cannot be
# serialized by Gradle's configuration cache (including on a cold checkout).
org.gradle.configuration-cache=false
